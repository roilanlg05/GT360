version: "3.8"

services:
  redis:
    image: redis:7
    container_name: gt360-redis-dev
    ports:
      - "6378:6379"
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - redis-cli
        - PING
      interval: 5s
      timeout: 3s
      retries: 20

  postgres:
    image: postgres:18.1
    container_name: gt360-postgres-dev
    restart: unless-stopped
    ports:
      - "5433:5432"
    env_file:
      - .env
    environment:
      PGDATA: /var/lib/postgresql/data
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB
      interval: 5s
      timeout: 3s
      retries: 30

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: gt360:dev
    container_name: gt360-app-dev
    env_file:
      - .env
    ports:
      - "8001:8000"
    restart: unless-stopped
    volumes:
      - ./uploads:/var/www/gt360/uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - python -c "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/health').read()"
      interval: 5s
      timeout: 3s
      retries: 30

  streaming:
    build:
      context: .
      dockerfile: services/streaming/Dockerfile
    image: trip-streaming:dev
    container_name: gt360-streaming-dev
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      app:
        condition: service_healthy

volumes:
  pgdata_dev:
